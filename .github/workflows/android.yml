name: Gerar APK Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**','dist/**','scripts/**','package*.json','capacitor.config.json','.github/workflows/android.yml']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Instalar SDK Android
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Preparar projeto Android
        run: |
          npx cap add android
          npx cap sync android
          node scripts/android-assets.mjs
      - name: Compilar APK de teste
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Instrumentais-HNL-APK-teste
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Resumo
        run: |
          echo '### Instrumentais HNL' >> "$GITHUB_STEP_SUMMARY"
          echo 'Baixe Instrumentais-HNL-APK-teste na seção Artifacts desta execução. APK de teste, com assinatura de desenvolvimento. A integração com a planilha é configurada no aplicativo.' >> "$GITHUB_STEP_SUMMARY"
